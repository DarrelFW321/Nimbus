name: build

on:
  push:
  pull_request:

jobs:
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK (headers, loader, glslc, dxc)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Install MinGW-w64 and Ninja
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build (C++ and all shaders)
        shell: msys2 {0}
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-windows
          path: |
            build/nimbus.exe
            build/shaders/*.spv
